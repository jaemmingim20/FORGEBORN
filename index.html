<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#191e1b" />
    <meta
      name="description"
      content="FORGEBORN — 중세 판타지 대장간의 첫걸음. 1인칭으로 연결된 3D 월드를 탐방하세요."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231b2422'/%3E%3Cpath d='M15 27h36l-8 9H29v8h10v5H17v-5h7V33l-9-3z' fill='%23d5ad69'/%3E%3C/svg%3E"
    />
    <style>
      /* This screen must remain readable even if the application module/CSS cannot load. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #16221e;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        color: #d6b477;
        background: #16221e;
        font: 13px/1.9 sans-serif;
        text-align: center;
      }
      #boot [hidden] {
        display: none !important;
      }
      #boot .boot-mark {
        border: 1px solid #d6b47755;
        padding: 4px 24px;
        font:
          72px Georgia,
          serif;
      }
      #boot-help {
        max-width: 540px;
        color: #ddd8c7;
      }
      #boot-retry {
        margin-top: 18px;
        padding: 12px 24px;
        background: #d6b477;
        color: #16221e;
        border: 0;
        font: inherit;
        cursor: pointer;
      }
    </style>
    <script>
      // This guard runs before the module graph and survives Vite's production HTML rewrite.
      window.addEventListener(
        'error',
        function (event) {
          if (!(event.target instanceof HTMLScriptElement) && !(event instanceof ErrorEvent))
            return;
          var label = document.getElementById('boot-message');
          var help = document.getElementById('boot-help');
          if (!label || !help) return;
          label.textContent = '게임 파일을 불러오지 못했습니다.';
          help.hidden = false;
        },
        true,
      );
      window.setTimeout(function () {
        var help = document.getElementById('boot-help');
        var detail = document.getElementById('boot-detail');
        if (!help || !detail || !help.hidden) return;
        help.hidden = false;
        detail.textContent =
          '초기화가 지연되고 있습니다. 잠시 더 기다리거나 다시 시도해 주세요. 파일 미리보기에서는 standalone/index.html 실행본을 사용해 주세요.';
      }, 15000);
    </script>
    <title>FORGEBORN · 불꽃에서 시작되는 이야기</title>
  </head>
  <body>
    <main id="app">
      <div id="boot" role="status">
        <span class="boot-mark">F</span>
        <p id="boot-message">대장간의 불을 지피는 중…</p>
        <div id="boot-help" hidden>
          <p id="boot-detail">
            게임 실행 파일을 불러오지 못했습니다. 파일 미리보기에서는 빌드한 standalone/index.html
            실행본을 열어 주세요. 개발할 때는 npm run dev로 실행해야 합니다.
          </p>
          <button id="boot-retry" type="button" onclick="window.location.reload()">
            다시 시도
          </button>
        </div>
        <noscript>이 게임을 실행하려면 JavaScript를 허용하는 PC 브라우저가 필요합니다.</noscript>
      </div>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
